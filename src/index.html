<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PipTimer</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1C0B8D">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./public/icon/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="./public/icon/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./public/icon/icon-16.png">
    <link rel="shortcut icon" href="./public/icon/favicon.ico">

    <!-- iOS / iPadOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PipTimer">
    <link rel="apple-touch-icon" href="./public/icon/icon-180.png">
    <link rel="apple-touch-icon" sizes="120x120" href="./public/icon/icon-120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="./public/icon/icon-152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="./public/icon/icon-167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="./public/icon/icon-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/base.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/layout.css">
    <link rel="stylesheet" href="./style/progress.css">
    <link rel="stylesheet" href="./style/controls.css">
</head>
<body>
    <div class="container" id="mainContainer">
        <!-- ヘッダー -->
        <header class="header">
            <h1>PipTimer</h1>
            <div class="header-buttons">
                <button id="fullscreenBtn" class="header-btn" aria-label="全画面表示">
                    <img src="./public/img/fullscreen.svg" alt="全画面">
                </button>
                <button id="themeToggle" class="header-btn theme-toggle" aria-label="テーマ切り替え">
                    <img class="icon-sun" src="./public/img/sun.svg" alt="ライトモード">
                    <img class="icon-moon" src="./public/img/moon.svg" alt="ダークモード">
                </button>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- タイマー入力セクション -->
            <section class="input-section" id="inputSection">
                <div class="time-input">
                    <div class="input-group">
                        <label for="hours">時間</label>
                        <input type="number" id="hours" min="0" max="23" value="0">
                    </div>
                    <div class="input-group">
                        <label for="minutes">分</label>
                        <input type="number" id="minutes" min="0" max="59" value="1">
                    </div>
                    <div class="input-group">
                        <label for="seconds">秒</label>
                        <input type="number" id="seconds" min="0" max="59" value="0">
                    </div>
                </div>
                <button id="startBtn" class="btn btn-primary">開始</button>
            </section>

            <!-- タイマー表示セクション -->
            <section class="timer-section" id="timerSection" style="display: none;">
                <!-- メインSVGタイマー（ベクター・ジャギーなし） -->
                <svg id="mainSvg" class="timer-svg" viewBox="0 0 480 270"
                     preserveAspectRatio="xMidYMid meet"
                     xmlns="http://www.w3.org/2000/svg">
                    <!-- 背景 -->
                    <rect class="svg-bg" width="480" height="270"/>
                    <!-- トラック（縁全周・背景色・ラウンドコーナー） -->
                    <path class="svg-track"
                          d="M 24,12 H 456 A 12,12 0 0,1 468,24 V 246 A 12,12 0 0,1 456,258 H 24 A 12,12 0 0,1 12,246 V 24 A 12,12 0 0,1 24,12 Z"
                          fill="none" stroke-width="24"
                          stroke-linecap="butt" stroke-linejoin="round"/>
                    <!-- プログレス（残り時間の割合分だけ描画・ラウンドコーナー） -->
                    <path class="svg-progress" id="svgProgress"
                          d="M 24,12 H 456 A 12,12 0 0,1 468,24 V 246 A 12,12 0 0,1 456,258 H 24 A 12,12 0 0,1 12,246 V 24 A 12,12 0 0,1 24,12 Z"
                          fill="none" stroke-width="24"
                          stroke-linecap="butt" stroke-linejoin="round"
                          stroke-dasharray="1383.4" stroke-dashoffset="0"/>
                    <!-- 残り時間 hh:mm:ss -->
                    <text id="svgTime" class="svg-time"
                          x="240" y="135"
                          text-anchor="middle" dominant-baseline="middle">00:00:00</text>
                    <!-- アラーム時刻 hh:mm -->
                    <text id="svgAlarm" class="svg-alarm"
                          x="240" y="183"
                          text-anchor="middle" dominant-baseline="middle"></text>
                </svg>

                <div class="controls">
                    <button id="pauseBtn" class="btn btn-secondary">一時停止</button>
                    <button id="stopBtn" class="btn btn-danger">停止</button>
                    <button id="pipBtn" class="btn btn-pip" title="Picture-in-Picture">
                        <img src="./public/img/pip.svg" alt="PiP">
                    </button>
                </div>
            </section>

            <!-- PiP用キャンバス（非表示） -->
            <canvas id="pipCanvas" style="display: none;"></canvas>
        </main>
    </div>

    <script src="./script/theme.js"></script>
    <script src="./script/timer.js"></script>
    <script src="./script/ui.js"></script>
    <script src="./script/pip.js"></script>
    <script src="./script/canvas.js"></script>
    <script src="./script/timerSvg.js"></script>
    <script src="./script/app.js"></script>

    <!-- Service Worker 登録 -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => console.log('[SW] registered:', reg.scope))
            .catch((err) => console.warn('[SW] registration failed:', err));
        });
      }
    </script>
</body>
</html>
