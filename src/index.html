<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PipTimer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style/base.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/layout.css">
    <link rel="stylesheet" href="./style/progress.css">
    <link rel="stylesheet" href="./style/controls.css">
</head>
<body>
    <div class="container" id="mainContainer">
        <!-- ヘッダー -->
        <header class="header">
            <h1>PipTimer</h1>
            <div class="header-buttons">
                <button id="fullscreenBtn" class="header-btn" aria-label="全画面表示">
                    <img src="./public/img/fullscreen.svg" alt="全画面">
                </button>
                <button id="themeToggle" class="header-btn theme-toggle" aria-label="テーマ切り替え">
                    <img class="icon-sun" src="./public/img/sun.svg" alt="ライトモード">
                    <img class="icon-moon" src="./public/img/moon.svg" alt="ダークモード">
                </button>
            </div>
        </header>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <!-- タイマー入力セクション -->
            <section class="input-section" id="inputSection">
                <div class="time-input">
                    <div class="input-group">
                        <label for="hours">時間</label>
                        <input type="number" id="hours" min="0" max="23" value="0">
                    </div>
                    <div class="input-group">
                        <label for="minutes">分</label>
                        <input type="number" id="minutes" min="0" max="59" value="1">
                    </div>
                    <div class="input-group">
                        <label for="seconds">秒</label>
                        <input type="number" id="seconds" min="0" max="59" value="0">
                    </div>
                </div>
                <button id="startBtn" class="btn btn-primary">開始</button>
            </section>

            <!-- タイマー表示セクション -->
            <section class="timer-section" id="timerSection" style="display: none;">
                <div class="timer-display">
                    <div class="time-value" id="timeDisplay">00:01:00</div>
                    <div class="alarm-time" id="alarmTime">アラーム: 09:30</div>
                    <div class="end-time" id="endTime">終了: 09:30</div>
                    <div class="subtitle" id="timerStatus">準備完了</div>
                </div>

                <!-- プログレスバー（円形） -->
                <div class="progress-circle-container">
                    <svg class="progress-circle" viewBox="0 0 200 200">
                        <circle class="progress-background" cx="100" cy="100" r="90"/>
                        <circle class="progress-fill" cx="100" cy="100" r="90" id="progressCircle"/>
                    </svg>
                </div>

                <div class="controls">
                    <button id="pauseBtn" class="btn btn-secondary">一時停止</button>
                    <button id="stopBtn" class="btn btn-danger">停止</button>
                    <button id="pipBtn" class="btn btn-pip" title="Picture-in-Picture">
                        <img src="./public/img/pip.svg" alt="PiP">
                    </button>
                </div>
            </section>

            <!-- PiP用キャンバス（非表示） -->
            <canvas id="pipCanvas" style="display: none;"></canvas>
        </main>
    </div>

    <script src="./script/theme.js"></script>
    <script src="./script/timer.js"></script>
    <script src="./script/ui.js"></script>
    <script src="./script/pip.js"></script>
    <script src="./script/canvas.js"></script>
    <script src="./script/app.js"></script>
</body>
</html>
